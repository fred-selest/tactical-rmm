[project]
name = "tactical-rmm-linux-integration"
version = "1.0.0"
description = "Linux deployment integration for Tactical RMM"
requires-python = ">=3.8"
dependencies = [
    "Django>=3.2,<5.0",
    "djangorestframework>=3.12,<4.0",
    "django-ratelimit>=4.0,<5.0",
    "psycopg2-binary>=2.9",
]

[project.optional-dependencies]
dev = [
    "flake8>=6.0",
    "ruff>=0.1",
    "pytest>=7.0",
    "pytest-django>=4.5",
    "shellcheck-py>=0.9",
]

[tool.ruff]
line-length = 120
target-version = "py38"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tacticalrmm.settings"
python_files = ["test_*.py"]
