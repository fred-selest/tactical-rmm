# Configuration de la mise à jour automatique Tactical RMM
#
# Ce fichier doit être placé dans: /etc/tactical-rmm/auto-update.conf

# Activer/désactiver les mises à jour automatiques
# Valeurs: true ou false
AUTO_UPDATE_ENABLED=true

# La fréquence est fixée par tactical-agent-updater.timer.
# rmmagent-linux.sh sauvegarde toujours l'ancien binaire et revient en arrière
# si le service ne redémarre pas avec la nouvelle version.

# Email de notification (laisser vide pour désactiver)
# Exemple: NOTIFICATION_EMAIL="admin@votredomaine.com"
NOTIFICATION_EMAIL=""

# Webhook de notification (Slack, Discord, etc.)
# Exemple: NOTIFICATION_WEBHOOK="https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
NOTIFICATION_WEBHOOK=""

# Fenêtre de mise à jour (format HH:MM). Une fenêtre à cheval sur minuit
# (ex. 23:00 -> 02:00) est acceptée. `tactical-agent-updater.sh --now` l'ignore.
UPDATE_WINDOW_START="02:00"
UPDATE_WINDOW_END="05:00"

# Tag rmmagent visé. Vide = celui épinglé dans rmmagent-linux.sh (AGENT_REF).
# Doit correspondre à LATEST_AGENT_VER du serveur RMM, PAS à la dernière
# release GitHub : un agent plus récent ou plus ancien que le serveur reste
# bloqué en « agentupdate pending ».
TARGET_AGENT_REF=""

# Script moteur. La copie locale est utilisée si elle existe, sinon il est
# téléchargé depuis UPDATE_SCRIPT_URL (TLS vérifié, syntaxe contrôlée).
UPDATE_SCRIPT="/usr/local/bin/rmmagent-linux.sh"
UPDATE_SCRIPT_URL="https://raw.githubusercontent.com/fred-selest/tactical-rmm/main/rmmagent-linux.sh"
