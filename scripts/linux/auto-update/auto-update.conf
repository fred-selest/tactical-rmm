# Configuration de la mise à jour automatique Tactical RMM
#
# Ce fichier doit être placé dans: /etc/tactical-rmm/auto-update.conf

# Activer/désactiver les mises à jour automatiques
# Valeurs: true ou false
AUTO_UPDATE_ENABLED=true

# Intervalle de vérification en jours (non utilisé avec systemd timer, mais conservé pour référence)
CHECK_INTERVAL_DAYS=7

# Activer les sauvegardes avant mise à jour
# Valeurs: true ou false
BACKUP_ENABLED=true

# Email de notification (laisser vide pour désactiver)
# Exemple: NOTIFICATION_EMAIL="admin@votredomaine.com"
NOTIFICATION_EMAIL=""

# Webhook de notification (Slack, Discord, etc.)
# Exemple: NOTIFICATION_WEBHOOK="https://hooks.slack.com/services/YOUR/WEBHOOK/URL"
NOTIFICATION_WEBHOOK=""

# Fenêtre de mise à jour (format HH:MM)
# Les mises à jour ne seront effectuées que pendant cette fenêtre
UPDATE_WINDOW_START="02:00"
UPDATE_WINDOW_END="05:00"

# Dépôt GitHub de rmmagent (ne pas modifier sauf si vous utilisez un fork)
GITHUB_REPO="amidaware/rmmagent"

# URL du script de mise à jour (personnaliser selon votre dépôt)
# Exemple: UPDATE_SCRIPT_URL="https://raw.githubusercontent.com/votre-user/tactical-rmm/main/rmmagent-linux-ameliore.sh"
UPDATE_SCRIPT_URL=""

# Niveau de log (info, warn, error)
LOG_LEVEL="info"

# Conserver les logs pendant N jours
LOG_RETENTION_DAYS=30
