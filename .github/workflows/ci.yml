name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-python:
    name: Lint Python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install ruff flake8

      - name: Run Ruff
        run: ruff check integration/backend/

      - name: Run Flake8
        run: flake8 integration/backend/ --max-line-length=120 --ignore=E501,W503

  lint-shell:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install ShellCheck
        run: sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: |
          find . -name "*.sh" -not -path "./.git/*" | xargs shellcheck --severity=warning || true

  test-python:
    name: Test Python
    runs-on: ubuntu-latest
    needs: lint-python
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-django

      - name: Run tests
        run: python -m pytest -v --tb=short

  security-check:
    name: Security Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check for secrets
        run: |
          # Vérifier qu'aucun secret n'est dans le code
          if grep -rn "password\s*=\s*['\"][^'\"]*['\"]" integration/backend/ --include="*.py" | grep -v "test_" | grep -v "#"; then
            echo "WARNING: Possible hardcoded password found"
          fi

      - name: Check for large binaries
        run: |
          find . -size +5M -not -path "./.git/*" -exec ls -lh {} \;
